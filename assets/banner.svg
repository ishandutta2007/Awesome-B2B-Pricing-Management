<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1933" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glass card gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <radialGradient id="glowPulse1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPulse2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes waveDash {
        to { stroke-dashoffset: -120; }
      }
      @keyframes barGrow {
        0%, 100% { transform: scaleY(0.92); }
        50% { transform: scaleY(1.08); }
      }

      .floating-node-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-node-2 { animation: floatReverse 7s ease-in-out infinite; }
      .pulsing-orb { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .dynamic-line { stroke-dasharray: 8 6; animation: waveDash 20s linear infinite; }
      .animated-bar { transform-origin: bottom; animation: barGrow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Background Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="220" fill="url(#glowPulse1)" class="pulsing-orb" />
  <circle cx="1020" cy="300" r="240" fill="url(#glowPulse2)" class="pulsing-orb" />

  <!-- Tech Grid Background Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Curved Market Curve / Revenue Flow in Background -->
  <path d="M 50 360 C 250 330, 400 370, 600 310 C 800 250, 950 280, 1150 180" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.3" class="dynamic-line" />
  <path d="M 50 380 C 250 350, 450 390, 650 330 C 850 270, 1000 290, 1150 200" 
        fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" class="dynamic-line" />

  <!-- Background Decorative Left Dynamic Flow Visual (stays clearly behind text margins) -->
  <g class="floating-node-1" transform="translate(60, 130)" opacity="0.75" filter="url(#softShadow)">
    <rect width="130" height="74" rx="10" fill="url(#glassGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DYNAMIC CPQ</text>
    <text x="16" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">+34.8%</text>
    <path d="M 80 50 Q 95 35 110 40" fill="none" stroke="#10b981" stroke-width="2.5" />
  </g>

  <!-- Background Decorative Right Dynamic Flow Visual (stays clearly behind text margins) -->
  <g class="floating-node-2" transform="translate(1010, 130)" opacity="0.75" filter="url(#softShadow)">
    <rect width="130" height="74" rx="10" fill="url(#glassGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="16" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PRICE ELASTICITY</text>
    <text x="16" y="52" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">OPTIMIZED</text>
    <circle cx="106" cy="46" r="6" fill="#10b981" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-175" y="-18" width="350" height="36" rx="18" fill="url(#glassGrad)" stroke="url(#primaryGrad)" stroke-width="1.5" />
    <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
      ENTERPRISE PRICING &amp; BILLING
    </text>
  </g>

  <!-- FOREGROUND MAIN TITLE: Sharp & Clear Contrast -->
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#ffffff">Awesome </tspan>
    <tspan fill="url(#primaryGrad)">B2B Pricing </tspan>
    <tspan fill="#ffffff">Management</tspan>
  </text>

  <!-- FOREGROUND SUBTITLE & TAGLINE -->
  <text x="600" y="200" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
    Curated Hub for Price Lists, Dynamic Quoting, Metered Billing &amp; Deal Governance
  </text>

  <text x="600" y="232" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Covering Enterprise AI Suites &amp; Leading Open-Source Pricing Infrastructure
  </text>

  <!-- FOREGROUND PILLS / FEATURE BADGES (Anchored centrally, clean and unobscured) -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: Price Lists -->
    <g transform="translate(-360, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🏷️ Price Lists</text>
    </g>

    <!-- Pill 2: Usage-Based Billing -->
    <g transform="translate(-180, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
      <text x="0" y="5" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Metered Billing</text>
    </g>

    <!-- Pill 3: Deal Desk & CPQ -->
    <g transform="translate(10, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
      <text x="0" y="5" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">💼 Deal Desk &amp; CPQ</text>
    </g>

    <!-- Pill 4: AI Price Elasticity -->
    <g transform="translate(195, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="0" y="5" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">📈 Price Elasticity</text>
    </g>

    <!-- Pill 5: Open-Source -->
    <g transform="translate(370, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌟 Open-Source</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="250" y1="380" x2="950" y2="380" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
</svg>
